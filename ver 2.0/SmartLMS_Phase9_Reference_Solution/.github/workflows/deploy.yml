name: SmartLMS Deploy

on:
  workflow_run:
    workflows:
      - SmartLMS CI
    types:
      - completed

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy Production

    # Advanced / optional deployment:
    # deploy only a successful CI run for main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout successful commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build \
            --file backend/Dockerfile.prod \
            --tag "${IMAGE_URI}" \
            ./backend

          docker push "${IMAGE_URI}"

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build production frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy frontend to S3
        run: |
          aws s3 sync \
            frontend/dist/ \
            "s3://${{ vars.S3_BUCKET }}/" \
            --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Deploy backend through AWS Systems Manager
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          COMMAND_ID=$(
            aws ssm send-command \
              --instance-ids "${INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy SmartLMS ${IMAGE_URI}" \
              --parameters "commands=[
                \"set -e\",
                \"aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}\",
                \"docker pull ${IMAGE_URI}\",
                \"docker run --rm --env-file /opt/smartlms/backend.env ${IMAGE_URI} flask --app run.py db upgrade\",
                \"docker rm -f smartlms-backend || true\",
                \"docker run -d --name smartlms-backend --restart unless-stopped --env-file /opt/smartlms/backend.env -p 80:8000 ${IMAGE_URI}\"
              ]" \
              --query "Command.CommandId" \
              --output text
          )

          echo "SSM Command: ${COMMAND_ID}"

          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}"

      - name: Production health check
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 5 \
            "${API_HEALTH_URL}"
